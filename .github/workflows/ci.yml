name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cache pinned zmac
        id: zmac
        uses: actions/cache@v4
        with:
          path: tools/zmac
          key: zmac-050bbb1f9c608693d53b8827b991b5a9edc97a6b-${{ runner.os }}
      - if: steps.zmac.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y bison
      - run: pnpm zmac:install
      - run: pnpm zex:install
      - run: pnpm typecheck
      - run: FUGLOY_REQUIRE_ZMAC=1 FUGLOY_REQUIRE_ZEX=1 pnpm test
      - run: pnpm build
      - name: fixtures and symbol tables are in sync with their sources
        run: pnpm fixtures && pnpm symbols && git diff --exit-code -- fixtures/synthetic packages/disasm/src/symbols/tables.generated.ts packages/disasm/data/symbols/COMPARISON.md

  web:
    name: web workbench (typecheck, unit, SEO, browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser specs import @fugloy/disasm and @fugloy/cli as Node resolves them, from dist/.
      - run: pnpm build
      - run: pnpm --filter @fugloy/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fugloy/web typecheck
      - run: pnpm --filter @fugloy/web test
      # test:seo generates the site as Netlify does (and checks the test hook is not in it); the Playwright web server
      # generates it again with NUXT_PUBLIC_E2E=1, which compiles the hook in, before serving it.
      - run: pnpm --filter @fugloy/web test:seo
      # On test:seo's build: no page prefetches or preloads a lazily loaded part (Source ✎, Run ▶, emu), and the first screen still preloads its page.
      - run: pnpm --filter @fugloy/web test:prefetch
      # Timing limits in listing-perf.spec.ts apply only with FUGLOY_PERF=1, so a slow runner cannot fail the build.
      - run: pnpm --filter @fugloy/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore
