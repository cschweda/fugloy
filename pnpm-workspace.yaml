packages:
  - 'packages/*'
  - 'apps/*'

# A semver range naming a workspace package resolves to the local package, as npm
# workspaces would. (packages/mcp names its siblings as workspace:^, which pnpm pack turns into ^X.Y.Z.)
linkWorkspacePackages: true

# Build scripts nobody needs: pdf.js's optional Node canvas (the site renders in
# the browser) and vue-demi's Vue 2/3 switch. Listing them silences pnpm's
# "Ignored build scripts" warning.
ignoredBuiltDependencies:
  - '@napi-rs/canvas'
  - vue-demi
