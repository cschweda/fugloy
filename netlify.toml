# Static deployment of the web workbench (apps/web, phase 4): Nuxt 4 static
# generation, no server routes. The site's primary domain is app.fugloy.dev;
# the apex and www redirect to it until a landing page exists (see the plan's
# "Name and hosting"). The build copies the public-domain examples in, then
# generates into apps/web/.output/public.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @fugloy/web run generate"
  publish = "apps/web/.output/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[redirects]]
  from = "https://fugloy.dev/*"
  to = "https://app.fugloy.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fugloy.dev/*"
  to = "https://app.fugloy.dev/:splat"
  status = 301
  force = true

# The Netlify host answers too; send it to the site's own name so there is one copy to index.
# Branch deploys and deploy previews (staging--fugloy.netlify.app, deploy-preview-N--…) are other hosts and stay.
[[redirects]]
  from = "https://fugloy.netlify.app/*"
  to = "https://app.fugloy.dev/:splat"
  status = 301
  force = true

# No other site may frame the app (it has one-click controls that remove stored things). The policy
# names only what cannot break a page: Nuxt's inline scripts, the explainer's new Function and injected
# style, pdf.js's wasm and the archive.org covers all rule out a script-src, style-src or img-src here.
# Fullscreen is left alone: Run ▶ uses it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), display-capture=()"

# Everything Vite writes into /_nuxt/ with these extensions carries a content hash in its name, so it
# never changes and need never be asked for again. Named by extension so that /_nuxt/builds/*.json
# (the unhashed build manifest Nuxt polls) keeps Netlify's must-revalidate.
[[headers]]
  for = "/_nuxt/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_nuxt/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The example programs are bytes; by extension a .cmd would be served as a Windows batch file,
# which a filtering proxy may refuse.
[[headers]]
  for = "/examples/*"
  [headers.values]
    Content-Type = "application/octet-stream"

# pdf.js's worker (loaded only when a manual is opened) is an .mjs module
# worker; with nosniff it must be served as JavaScript.
[[headers]]
  for = "/_nuxt/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
