# Static deployment of the web workbench (apps/web, phase 4): Nuxt 4 static
# generation, no server routes. The site's primary domain is app.fugloy.dev;
# the apex and www redirect to it until a landing page exists (see the plan's
# "Name and hosting"). The build copies the public-domain examples in, then
# generates into apps/web/.output/public.

[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @fugloy/web run generate"
  publish = "apps/web/.output/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[redirects]]
  from = "https://fugloy.dev/*"
  to = "https://app.fugloy.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fugloy.dev/*"
  to = "https://app.fugloy.dev/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# pdf.js's worker (loaded only when a manual is opened) is an .mjs module
# worker; with nosniff it must be served as JavaScript.
[[headers]]
  for = "/_nuxt/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
